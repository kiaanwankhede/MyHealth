name: Build APK

# Same flow as the Kharcha repo: build on every push, publish a release with a plain .apk
# so the phone can always grab https://github.com/<owner>/<repo>/releases/latest/download/myhealth.apk
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: |
          npx tsc --noEmit
          npx jest --ci

      # Expo generates the native Android project from app.json (it is not committed).
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      # Release build: the JavaScript is bundled into the APK, so it runs without a dev server.
      # Signed with the Expo template's debug key, which is the same on every build, so a new
      # APK installs over the old one and keeps your data.
      # 64-bit ARM only (every modern Android phone): cuts the native build roughly in four.
      - name: Build the APK
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk myhealth.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MyHealth build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: myhealth.apk
          body: |
            Install: download myhealth.apk below on your phone and open it.
            Then in Google Fit settings turn on syncing with Health Connect, open MyHealth and tap Allow access.
            Built from ${{ github.ref_name }} at ${{ github.sha }}.

      - uses: actions/upload-artifact@v4
        with:
          name: myhealth-apk
          path: myhealth.apk
          if-no-files-found: error
