name: Smoke test APK

# Builds the same release APK as "Build APK", but for the emulator's x86_64 processor, installs it
# on an Android emulator, opens it and records whether it stays up: crash log, JS errors, the text
# on screen and a screenshot. Runs on every push, alongside the real build.
on:
  push:
  workflow_dispatch:

concurrency:
  group: smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build the APK (x86_64, for the emulator)
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell monkey -p com.kiaanwankhede.sehat -c android.intent.category.LAUNCHER 1
            sleep 30
            adb exec-out screencap -p > screen.png
            (adb shell pidof com.kiaanwankhede.sehat && echo "RESULT: app is running") || echo "RESULT: app is NOT running"
            adb shell uiautomator dump /sdcard/ui.xml && adb pull /sdcard/ui.xml ui.xml
            echo "===== text on screen =====" && (grep -o 'text="[^"]*"' ui.xml | grep -v 'text=""' | head -40 || true)
            adb logcat -d -b crash > crash.txt
            adb logcat -d > logcat.txt
            echo "===== crash buffer =====" && cat crash.txt
            echo "===== app errors =====" && (grep -E "ReactNativeJS|AndroidRuntime|com.kiaanwankhede.sehat" logcat.txt | grep -E " E | W |FATAL" | tail -60 || true)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: |
            screen.png
            ui.xml
            crash.txt
            logcat.txt
